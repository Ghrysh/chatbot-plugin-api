services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    whatsapp-server:
        image: 'node:20-slim'
        working_dir: /app
        command: >
            sh -c "apt-get update && apt-get install -y chromium && npm install && npm start"
        ports:
            - '${WA_SERVER_PORT:-3100}:3100'
        environment:
            WA_SERVER_PORT: 3100
            LARAVEL_API_URL: 'http://laravel.test'
            WEBHOOK_SECRET: '${WA_WEBHOOK_SECRET:-futurecloud-wa-secret}'
            WA_API_KEY: '${WA_API_KEY:-futurecloud-wa-api-key}'
            PUPPETEER_EXECUTABLE_PATH: '/usr/bin/chromium'
        volumes:
            - './whatsapp-server:/app'
            - 'wa-sessions:/app/.wwebjs_auth'
        networks:
            - sail
        depends_on:
            - laravel.test
    ollama:
        image: ollama/ollama:latest
        container_name: chatbot-plugin-ollama
        restart: unless-stopped
        ports:
            - "11434:11434"
        volumes:
            - ollama-data:/root/.ollama
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    wa-sessions:
        driver: local
    ollama-data:
        driver: local
